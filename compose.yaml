services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseexchange}
      POSTGRES_USER: ${POSTGRES_USER:-pulseexchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseexchange}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseexchange} -d ${POSTGRES_DB:-pulseexchange}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pulseexchange-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend
    environment:
      PULSEEXCHANGE_DATABASE_URL: ${PULSEEXCHANGE_DATABASE_URL:-postgresql+asyncpg://pulseexchange:pulseexchange@db:5432/pulseexchange}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      PULSEEXCHANGE_DATABASE_URL: ${PULSEEXCHANGE_DATABASE_URL:-postgresql+asyncpg://pulseexchange:pulseexchange@db:5432/pulseexchange}
      PULSEEXCHANGE_PROCESSOR_ENABLED: "false"
      PULSEEXCHANGE_EVENT_RELAY_ENABLED: "true"
      PULSEEXCHANGE_PROCESSOR_POLL_INTERVAL_MS: ${PULSEEXCHANGE_PROCESSOR_POLL_INTERVAL_MS:-50}
      PULSEEXCHANGE_PROCESSOR_HEARTBEAT_STALE_SECONDS: ${PULSEEXCHANGE_PROCESSOR_HEARTBEAT_STALE_SECONDS:-10}
      PULSEEXCHANGE_WEBSOCKET_REPLAY_LIMIT: ${PULSEEXCHANGE_WEBSOCKET_REPLAY_LIMIT:-100}
      PULSEEXCHANGE_MAX_WEBSOCKET_CONNECTIONS: ${PULSEEXCHANGE_MAX_WEBSOCKET_CONNECTIONS:-100}
      PULSEEXCHANGE_MUTATION_RATE_LIMIT: ${PULSEEXCHANGE_MUTATION_RATE_LIMIT:-120}
      PULSEEXCHANGE_MUTATION_RATE_WINDOW_SECONDS: ${PULSEEXCHANGE_MUTATION_RATE_WINDOW_SECONDS:-60}
      PULSEEXCHANGE_TRUST_PROXY_HEADERS: "true"
      PULSEEXCHANGE_MAX_REQUEST_BODY_BYTES: ${PULSEEXCHANGE_MAX_REQUEST_BODY_BYTES:-16384}
      PULSEEXCHANGE_MAX_QUEUED_COMMANDS: ${PULSEEXCHANGE_MAX_QUEUED_COMMANDS:-1000}
      PULSEEXCHANGE_CORS_ORIGINS: ${PULSEEXCHANGE_CORS_ORIGINS:-["http://localhost:3001","http://localhost:5173"]}
    command: ["uvicorn", "pulseexchange.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  processor:
    build:
      context: ./backend
    environment:
      PULSEEXCHANGE_DATABASE_URL: ${PULSEEXCHANGE_DATABASE_URL:-postgresql+asyncpg://pulseexchange:pulseexchange@db:5432/pulseexchange}
      PULSEEXCHANGE_PROCESSOR_ENABLED: "true"
      PULSEEXCHANGE_PROCESSOR_POLL_INTERVAL_MS: ${PULSEEXCHANGE_PROCESSOR_POLL_INTERVAL_MS:-50}
      PULSEEXCHANGE_PROCESSOR_HEARTBEAT_INTERVAL_SECONDS: ${PULSEEXCHANGE_PROCESSOR_HEARTBEAT_INTERVAL_SECONDS:-2}
      PULSEEXCHANGE_PROCESSOR_ERROR_BACKOFF_MS: ${PULSEEXCHANGE_PROCESSOR_ERROR_BACKOFF_MS:-1000}
    command: ["python", "-m", "pulseexchange.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  pulseexchange-postgres:
