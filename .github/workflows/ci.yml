name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulseexchange_test
          POSTGRES_USER: pulseexchange
          POSTGRES_PASSWORD: pulseexchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseexchange -d pulseexchange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PULSEEXCHANGE_DATABASE_URL: postgresql+asyncpg://pulseexchange:pulseexchange@localhost:5432/pulseexchange_test
      PULSEEXCHANGE_TEST_DATABASE_URL: postgresql+asyncpg://pulseexchange:pulseexchange@localhost:5432/pulseexchange_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check scripts
      - run: ruff check scripts
      - run: mypy src
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag pulseexchange-backend ./backend
      - run: docker build --tag pulseexchange-frontend ./frontend
