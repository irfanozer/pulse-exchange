name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulseexchange_test
          POSTGRES_USER: pulseexchange
          POSTGRES_PASSWORD: pulseexchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseexchange -d pulseexchange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PULSEEXCHANGE_DATABASE_URL: postgresql+asyncpg://pulseexchange:pulseexchange@localhost:5432/pulseexchange_test
      PULSEEXCHANGE_TEST_DATABASE_URL: postgresql+asyncpg://pulseexchange:pulseexchange@localhost:5432/pulseexchange_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check scripts
      - run: ruff check scripts
      - run: mypy src
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Azure Bicep templates
        run: |
          az bicep build --file infra/azure/foundation.bicep --stdout > /dev/null
          az bicep build --file infra/azure/migration.bicep --stdout > /dev/null
          az bicep build --file infra/azure/apps.bicep --stdout > /dev/null
      - name: Parse Azure setup scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/azure/*.ps1 | ForEach-Object {
            [void] [scriptblock]::Create((Get-Content -Raw $_.FullName))
          }

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infrastructure]
    env:
      PULSEEXCHANGE_SEED_MARKET: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.28,<1" "websockets>=15,<16"
      - name: Build and start the separated API and processor stack
        run: docker compose up --build --detach
      - name: Wait for the browser entry point
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Verify matching, streaming, and reconnect recovery
        run: python scripts/smoke.py
      - name: Verify a measured concurrent command run
        run: >-
          python scripts/load_evidence.py
          --pairs 5
          --concurrency 5
          --output-prefix /tmp/pulseexchange-load-evidence
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the test stack
        if: always()
        run: docker compose down
